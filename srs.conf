listen              1935;
max_connections     1000;
daemon              off;

# http_api {
#     enabled         on;
#     listen          1985;
# }

# http_server {
#     enabled         on;
#     listen          8080;
#     dir             ./objs/nginx/html;
# }

vhost __defaultVhost__ {

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    4;
        hls_window      60;

        hls_m3u8_file   [app]/[stream]/[stream].m3u8;
        hls_ts_file     [app]/[stream]/[stream]-[seq].ts;
    }


    http_hooks {
        enabled on;

        on_publish http://host.docker.internal:3000/api/stream/publish;
        on_unpublish http://host.docker.internal:3000/api/stream/stop;
        on_hls http://host.docker.internal:3006/stream-worker/hls;

    }


} 